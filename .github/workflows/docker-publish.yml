name: Docker Publish

on:
  workflow_dispatch:

env:
  IMAGE_NAME: dbt1/mediathek-importer
  BACKEND_REPO: tuxbox-neutrino/mediathek-backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: db-import
          fetch-depth: 0

      - name: Checkout mediathek-backend
        uses: actions/checkout@v4
        with:
          repository: ${{ env.BACKEND_REPO }}
          path: mediathek-backend
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Prepare backend tree
        run: |
          rm -rf mediathek-backend/vendor/db-import
          mkdir -p mediathek-backend/vendor/db-import
          rsync -a --exclude='.git' db-import/ mediathek-backend/vendor/db-import/

      - name: Read importer version
        id: importer_version
        run: |
          set -euo pipefail
          VERSION=$(git -C db-import describe --tags --long --abbrev=7 2>/dev/null || git -C db-import rev-parse --short HEAD)
          # Dockerfile and entrypoint come from mediathek-backend and shape the runtime
          # behaviour just as much as the sources do. Without them in the tag, a change
          # there yields a different image under an unchanged tag - which happened on
          # 2026-08-03, when v0.5.0-0-gf185822 pointed at two different images hours
          # apart. Path-filtered, so unrelated backend commits do not churn the version.
          BUILD=$(git -C mediathek-backend log -1 --format=%h -- docker/importer)
          echo "value=${VERSION}-be${BUILD}" >> $GITHUB_OUTPUT

      - name: Build and push importer image
        working-directory: mediathek-backend
        run: |
          docker buildx build --platform linux/amd64,linux/arm64 \
            -t ${{ env.IMAGE_NAME }}:${{ steps.importer_version.outputs.value }} \
            -t ${{ env.IMAGE_NAME }}:latest \
            -f docker/importer/Dockerfile \
            --push .
